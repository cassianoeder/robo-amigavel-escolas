<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Robô Amigável — Assistente Escolar</title>
    <meta name="description" content="Robô amigável interativo para escolas com reconhecimento de voz e integração n8n.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- ===== CONFIG MODAL ===== -->
    <div id="config-overlay" class="modal-overlay active">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-icon">⚙️</div>
                <h1 id="modal-title">Configurar Robô</h1>
                <p class="modal-subtitle">Preencha a URL do webhook para ativar o robô</p>
            </div>

            <form id="config-form" class="modal-body" autocomplete="off">
                <!-- Robot Name -->
                <div class="field-group">
                    <label for="cfg-robot-name">Nome do Robô <span class="required">*</span></label>
                    <input type="text" id="cfg-robot-name" placeholder="Ex: Robô Amigável" required>
                </div>

                <!-- Teacher Name -->
                <div class="field-group">
                    <label for="cfg-professor-name">Nome do Professor <span class="optional">(opcional)</span></label>
                    <input type="text" id="cfg-professor-name" placeholder="Ex: Maria Silva">
                </div>

                <!-- Webhook URL -->
                <div class="field-group">
                    <label for="cfg-webhook">URL do Webhook n8n <span class="required">*</span></label>
                    <input type="url" id="cfg-webhook" placeholder="https://seu-n8n.com/webhook/..." required>
                </div>

                <!-- JWT Token -->
                <div class="field-group">
                    <label for="cfg-token">Token JWT Bearer <span class="optional">(opcional)</span></label>
                    <input type="text" id="cfg-token" placeholder="eyJhbGciOiJIUzI1NiIs...">
                </div>

                <!-- Location Section -->
                <div class="field-group">
                    <label>Localização</label>
                </div>

                <div class="field-group">
                    <label for="cfg-pais">País</label>
                    <input type="text" id="cfg-pais" placeholder="Brasil">
                </div>

                <div class="field-group">
                    <label for="cfg-estado">Estado</label>
                    <input type="text" id="cfg-estado" placeholder="São Paulo">
                </div>

                <div class="field-group">
                    <label for="cfg-cidade">Cidade</label>
                    <input type="text" id="cfg-cidade" placeholder="São Paulo">
                </div>

                <div class="field-group">
                    <label for="cfg-nome-escola">Nome da Escola</label>
                    <input type="text" id="cfg-nome-escola" placeholder="Escola Municipal">
                </div>

                <div class="field-group">
                    <label for="cfg-sala-local">Sala ou Local Físico</label>
                    <input type="text" id="cfg-sala-local" placeholder="Sala 101 ou Recepção">
                </div>

                <!-- Accent Color -->
                <div class="field-group">
                    <label>Cor de destaque do robô</label>
                    <div class="color-options" id="cfg-colors">
                        <button type="button" class="color-btn" data-color="rosa" style="--swatch:#FF69B4" title="Rosa">
                            <span class="swatch"></span><span class="color-label">Rosa</span>
                        </button>
                        <button type="button" class="color-btn" data-color="verde-neon" style="--swatch:#39FF14" title="Verde Neon">
                            <span class="swatch"></span><span class="color-label">Verde Neon</span>
                        </button>
                        <button type="button" class="color-btn selected" data-color="azul-escuro" style="--swatch:#1B3A6B" title="Azul Escuro">
                            <span class="swatch"></span><span class="color-label">Azul Escuro</span>
                        </button>
                        <button type="button" class="color-btn" data-color="laranja" style="--swatch:#FF6B35" title="Laranja">
                            <span class="swatch"></span><span class="color-label">Laranja</span>
                        </button>
                        <button type="button" class="color-btn" data-color="branco" style="--swatch:#FFFFFF" title="Branco">
                            <span class="swatch"></span><span class="color-label">Branco</span>
                        </button>
                    </div>
                </div>

                <!-- Voice -->
                <div class="field-group">
                    <label for="cfg-voice">Voz</label>
                    <select id="cfg-voice">
                        <option value="">Carregando vozes...</option>
                    </select>
                </div>

                <!-- Speech Rate -->
                <div class="field-group">
                    <label for="cfg-rate">Velocidade da fala: <span id="rate-value">1.0</span>x</label>
                    <input type="range" id="cfg-rate" min="0.5" max="2" step="0.1" value="1.0">
                </div>

                <!-- Speech Volume -->
                <div class="field-group">
                    <label for="cfg-volume">Volume do Robô: <span id="volume-value">100</span>%</label>
                    <input type="range" id="cfg-volume" min="0" max="130" step="5" value="100">
                </div>

                <!-- Hat Configuration -->
                <div class="field-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="cfg-hat-enabled">
                        <span>Mostrar Boné</span>
                    </label>
                </div>

                <div class="field-group hat-config-group hidden">
                    <label for="cfg-hat-color">Cor do Boné</label>
                    <input type="color" id="cfg-hat-color" value="#333333">
                </div>

                <div class="field-group hat-config-group hidden">
                    <label for="cfg-hat-logo">Logo do Boné (PNG/SVG)</label>
                    <input type="file" id="cfg-hat-logo" accept="image/png,image/svg+xml">
                    <div class="logo-preview-container">
                        <img id="hat-logo-preview" class="logo-preview hidden" alt="Preview do logo">
                        <button type="button" id="btn-remove-logo" class="btn-remove-logo hidden">Remover Logo</button>
                    </div>
                    <small class="field-hint">Imagem quadrada recomendada. Máximo 500KB.</small>
                </div>

                <!-- Sleepiness Timeout -->
                <div class="field-group">
                    <label for="cfg-sleep">Modo sonolência após inatividade</label>
                    <select id="cfg-sleep">
                        <option value="20">20 segundos</option>
                        <option value="40" selected>40 segundos</option>
                        <option value="60">1 minuto</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary" id="btn-save-config">
                    <span class="btn-icon">🤖</span> Ativar Robô
                </button>

                <button type="button" class="btn-secondary" id="btn-test-webhook" disabled>
                    <span class="btn-icon">🧪</span> Testar Webhook
                </button>
            </form>
        </div>
    </div>

    <!-- ===== DAILY TOPIC MODAL ===== -->
    <div id="daily-topic-overlay" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-icon">📚</div>
                <h1 id="topic-modal-title">Assunto do Dia</h1>
                <p class="modal-subtitle">Defina o assunto do dia para o robô focar as respostas</p>
            </div>

            <form id="daily-topic-form" class="modal-body" autocomplete="off">
                <!-- Topic Input -->
                <div class="field-group">
                    <label for="cfg-topic">Assunto do Dia <span class="optional">(máx. 70 caracteres)</span></label>
                    <input type="text" id="cfg-topic" maxlength="70" placeholder="Ex: Sistema Solar, Frações, Dinossauros...">
                </div>

                <!-- BNCC Section -->
                <div class="field-group">
                    <label>BNCC (Base Nacional Comum Curricular) <span class="optional">(opcional)</span></label>
                </div>

                <div class="field-group">
                    <label for="cfg-bncc-codigo">Código BNCC</label>
                    <input type="text" id="cfg-bncc-codigo" placeholder="Ex: EF05MA01">
                </div>

                <div class="field-group">
                    <label for="cfg-bncc-descricao">Descrição do Componente</label>
                    <input type="text" id="cfg-bncc-descricao" maxlength="200" placeholder="Ex: Resolver e elaborar problemas de adição e subtração">
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn-secondary" id="btn-clear-topic">
                        Limpar
                    </button>
                    <button type="submit" class="btn-primary" id="btn-save-topic">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== TOP CONTROLS ===== -->
    <div class="top-controls">
        <button id="btn-daily-topic" class="control-btn topic-btn" title="Definir Assunto do Dia" aria-label="Assunto do Dia">
            📚
            <span id="topic-active-indicator" class="topic-indicator hidden" title="Assunto do dia ativo"></span>
        </button>
        <button id="btn-kids-mode" class="control-btn kids-btn" title="Ativar Modo Kids" aria-label="Modo Kids">
            👶
        </button>
        <button id="btn-fullscreen" class="control-btn" title="Tela Cheia" aria-label="Tela Cheia">
            ⛶
        </button>
        <span id="connection-status" class="status-indicator"></span>
        <button id="btn-settings" class="control-btn settings-btn" title="Configurações" aria-label="Abrir configurações">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>
    </div>

    <!-- ===== ROBOT FACE CONTAINER ===== -->
    <main id="robot-container" class="robot-container hidden">
        <!-- Hidden video for camera/motion detection -->
        <video id="camera-feed" autoplay playsinline muted></video>
        <canvas id="motion-canvas"></canvas>

        <!-- Robot Face SVG -->
        <div class="robot-face-wrapper">
            <svg id="robot-face" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <clipPath id="left-eye-clip">
                        <ellipse cx="270" cy="210" rx="95" ry="100" />
                    </clipPath>
                    <clipPath id="right-eye-clip">
                        <ellipse cx="530" cy="210" rx="95" ry="100" />
                    </clipPath>
                    <clipPath id="head-clip">
                        <rect x="40" y="20" width="720" height="460" rx="80" ry="80" />
                    </clipPath>
                </defs>

                <!-- Face background (rounded screen) -->
                <rect id="face-bg" x="40" y="20" width="720" height="460" rx="80" ry="80" />

                <!-- Group everything inside the head to clip anything that spills out -->
                <g clip-path="url(#head-clip)">

                <!-- Hat (Boné) - Hidden by default, shown via config -->
                <g id="robot-hat" class="robot-hat hidden">
                    <!-- Hat base (cap) - positioned above head but in front of pupils -->
                    <path class="hat-base" d="M 150 50 L 650 50 L 650 90 Q 650 110 630 110 L 170 110 Q 150 110 150 90 Z" />
                    
                    <!-- Hat brim (aba) - extends forward -->
                    <path class="hat-brim" d="M 130 90 L 670 90 L 670 120 Q 670 130 650 130 L 150 130 Q 130 130 130 120 Z" />
                    
                    <!-- Logo container on front of hat -->
                    <g id="hat-logo-container" class="hat-logo-container">
                        <!-- Logo will be inserted here dynamically -->
                    </g>
                </g>

                <!-- Eyebrows moved below eyes to fix z-index -->

                <!-- Blush Cheeks -->
                <ellipse class="blush-cheek left" cx="200" cy="325" rx="35" ry="16" />
                <ellipse class="blush-cheek right" cx="600" cy="325" rx="35" ry="16" />

                <!-- Left Eye -->
                <g id="left-eye" class="eye">
                    <ellipse class="eye-white" cx="270" cy="210" rx="95" ry="100" />
                    <g clip-path="url(#left-eye-clip)">
                        <circle class="eye-iris" cx="270" cy="210" r="50" />
                        <circle class="eye-pupil" cx="270" cy="210" r="25" />
                        <ellipse class="eye-shine" cx="252" cy="190" rx="14" ry="18" />
                    </g>
                    <!-- Eyelid for blinking/sleepy -->
                    <ellipse class="eyelid" cx="270" cy="210" rx="100" ry="105" fill="var(--eyelid-color)" />
                    <!-- Happy curve -->
                    <path class="eye-happy-curve" d="M 200 230 Q 270 140 340 230" />
                </g>

                <!-- Right Eye -->
                <g id="right-eye" class="eye">
                    <ellipse class="eye-white" cx="530" cy="210" rx="95" ry="100" />
                    <g clip-path="url(#right-eye-clip)">
                        <circle class="eye-iris" cx="530" cy="210" r="50" />
                        <circle class="eye-pupil" cx="530" cy="210" r="25" />
                        <ellipse class="eye-shine" cx="512" cy="190" rx="14" ry="18" />
                    </g>
                    <!-- Eyelid for blinking/sleepy -->
                    <ellipse class="eyelid" cx="530" cy="210" rx="100" ry="105" fill="var(--eyelid-color)" />
                    <!-- Happy curve -->
                    <path class="eye-happy-curve" d="M 460 230 Q 530 140 600 230" />
                </g>

                <!-- Eyebrows -->
                <path id="left-eyebrow" class="eyebrow" d="M 190 80 Q 260 70 330 80" />
                <path id="right-eyebrow" class="eyebrow" d="M 470 80 Q 540 70 610 80" />

                <!-- Mouth -->
                <path id="robot-mouth" class="mouth" d="M 300 370 Q 400 420 500 370" />

                <!-- Question marks (thinking state) -->
                <g id="question-marks" class="question-marks hidden">
                    <text x="620" y="120" class="qmark q1">?</text>
                    <text x="660" y="80" class="qmark q2">?</text>
                    <text x="700" y="130" class="qmark q3">?</text>
                </g>

                <!-- Floating Hearts Container (Love effect) -->
                <g id="floating-hearts"></g>

                <!-- Sweat Drops (Hot effect) -->
                <g id="sweat-drops" class="hidden">
                    <path class="sweat-drop" d="M 680 120 Q 700 160 680 180 Q 660 160 680 120" fill="#88ccff" opacity="0.8" />
                    <path class="sweat-drop" d="M 120 150 Q 140 190 120 210 Q 100 190 120 150" fill="#88ccff" opacity="0.8" />
                </g>

                <!-- Sleep Z's (Sleepy effect) - SVG text like question marks -->
                <g id="sleep-zs" class="sleep-zs hidden">
                    <text x="380" y="100" class="sleep-z z1">z</text>
                    <text x="400" y="80" class="sleep-z z2">z</text>
                    <text x="420" y="120" class="sleep-z z3">z</text>
                </g>

                </g>
            </svg>
        </div>

        <!-- Bottom controls: Mic and Noise indicators -->
        <div class="bottom-controls">
            <!-- Microphone indicator -->
            <div id="mic-indicator" class="mic-indicator">
                <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
                <span class="mic-label" id="mic-label">Ouvindo...</span>
            </div>

            <!-- Noise warning indicator (Option 3: Ear + Noise waves) -->
            <div id="noise-warning" class="noise-warning hidden" title="Ambiente muito barulhento. Fale de perto do robô!">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10a3.5 3.5 0 1 1-7 0" />
                    <path d="M15 8.5a2.5 2.5 0 0 0-5 0v1.2" />
                    <path d="M3 9.5a4 4 0 0 1 0 5" class="noise-wave" />
                    <path d="M1 7a7 7 0 0 1 0 10" class="noise-wave" />
                </svg>
                <span>Ruído Alto</span>
            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="app-footer">
        By: Ederson Wermeier 🧡
    </footer>

    <script src="/js/config.js"></script>
    <script src="/js/robot-face.js"></script>
    <script src="/js/speech.js"></script>
    <script src="/js/motion.js"></script>
    <script src="/js/webhook.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
